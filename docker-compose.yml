services:
  orbitx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbitx-unified
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://orbitx:orbitx_password@postgres:5432/orbitx_db
      - ALLOWED_ORIGINS=http://localhost:8000,http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models

  postgres:
    image: postgres:16-alpine
    container_name: orbitx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbitx_db}
      POSTGRES_USER: ${POSTGRES_USER:-orbitx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbitx_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbitx} -d ${POSTGRES_DB:-orbitx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbitx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
