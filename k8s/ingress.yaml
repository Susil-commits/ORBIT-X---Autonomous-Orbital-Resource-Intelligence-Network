apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbitx-ingress
  namespace: orbitx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "orbitx-api-service"
spec:
  rules:
    - host: orbitx.missioncontrol.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orbitx-api-service
                port:
                  number: 8000
