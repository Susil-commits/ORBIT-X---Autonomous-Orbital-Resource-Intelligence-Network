apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitx-api
  namespace: orbitx
  labels:
    app: orbitx-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbitx-api
  template:
    metadata:
      labels:
        app: orbitx-api
    spec:
      containers:
        - name: api
          image: orbitx-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: orbitx-config
            - secretRef:
                name: orbitx-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
