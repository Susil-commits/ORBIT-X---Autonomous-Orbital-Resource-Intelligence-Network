apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orbitx-api-hpa
  namespace: orbitx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orbitx-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orbitx-worker-hpa
  namespace: orbitx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orbitx-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
