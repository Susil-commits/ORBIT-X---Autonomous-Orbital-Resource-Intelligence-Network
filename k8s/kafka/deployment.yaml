apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitx-kafka
  namespace: orbitx
  labels:
    app: orbitx-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbitx-kafka
  template:
    metadata:
      labels:
        app: orbitx-kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://orbitx-kafka-service:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
          ports:
            - containerPort: 9092
              name: kafka
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: orbitx-kafka-service
  namespace: orbitx
  labels:
    app: orbitx-kafka
spec:
  type: ClusterIP
  selector:
    app: orbitx-kafka
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka
