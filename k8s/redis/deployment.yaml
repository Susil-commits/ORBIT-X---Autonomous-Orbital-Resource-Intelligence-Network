apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitx-redis
  namespace: orbitx
  labels:
    app: orbitx-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbitx-redis
  template:
    metadata:
      labels:
        app: orbitx-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orbitx-redis-service
  namespace: orbitx
  labels:
    app: orbitx-redis
spec:
  type: ClusterIP
  selector:
    app: orbitx-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
