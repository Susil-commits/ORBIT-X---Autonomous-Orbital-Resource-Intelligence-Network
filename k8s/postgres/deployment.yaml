apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitx-postgres
  namespace: orbitx
  labels:
    app: orbitx-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbitx-postgres
  template:
    metadata:
      labels:
        app: orbitx-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: "orbitx_db"
            - name: POSTGRES_USER
              value: "orbitx"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orbitx-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "orbitx", "-d", "orbitx_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orbitx-postgres-service
  namespace: orbitx
  labels:
    app: orbitx-postgres
spec:
  type: ClusterIP
  selector:
    app: orbitx-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
