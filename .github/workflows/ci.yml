name: ORBIT-X Continuous Integration & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-eval:
    name: Backend Pytest & AI Eval Harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Backend Dependencies
        run: |
          uv sync --project backend --python 3.12

      - name: Run Backend Unit Tests (Pytest)
        run: |
          uv run --project backend pytest backend/tests -v

      - name: Run AI & Policy Regression Eval Harness
        run: |
          uv run --project backend python backend/eval/run_eval.py

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build
