global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'orbitx-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000', 'localhost:8000']
        labels:
          environment: 'production'
          service: 'orbitx-backend'

  - job_name: 'orbitx-workers'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:4000', 'localhost:4000']
        labels:
          environment: 'production'
          service: 'orbitx-workers'
