[project]
name = "orbitx-backend"
version = "0.2.0"
description = "ORBIT-X: Autonomous Orbital Resource & Intelligence Network Backend"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "ortools>=9.10.4067",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "websockets>=13.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "torch>=2.2.0",
    "xgboost>=2.0.0",
    "numba>=0.59.0",
    "shap>=0.45.0",
    "sentence-transformers>=3.0.0",
    "sgp4>=2.23",
    "skyfield>=1.48",
    "mcp>=1.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
